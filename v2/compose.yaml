name: dongkw-v2
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    ports:
      - "127.0.0.1:${V2_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: trader_v2
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${V2_DB_PASSWORD:?Run scripts/setup.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader_v2"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
