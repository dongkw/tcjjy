[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-v2"
version = "0.3.0"
description = "Local stock research backend for the dsh Agent learning project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.41,<4.50",
  "huggingface-hub>=0.28,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
trader-v2 = "trader_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trader_v2 = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL test database",
  "embedding: requires the pinned local BGE model and CPU runtime",
]
